version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '05:00'
    open-pull-requests-limit: 4
    groups:
      dart-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: wednesday
      time: '05:00'
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
