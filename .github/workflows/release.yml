name: Horus Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.38.7"

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/ci/repository_hygiene.sh
      - run: bash tool/generate.sh
      - run: flutter analyze --fatal-warnings
      - run: flutter test

  web:
    name: Build Web Release
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/generate.sh
      - name: Build web
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          test -n "$PROD_SUPABASE_URL"
          test -n "$PROD_SUPABASE_ANON_KEY"
          flutter build web --release             --dart-define=SUPABASE_URL="$PROD_SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$PROD_SUPABASE_ANON_KEY"             --dart-define=BUILD_FINGERPRINT=RELEASE             --dart-define=COMMIT_HASH="${{ github.sha }}"             --dart-define=APP_VERSION="${{ github.ref_name }}"
      - name: Package web release
        run: |
          cd build/web
          zip -r "../../../horus-web-${{ github.ref_name }}.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: horus-web-${{ github.ref_name }}.zip

  android:
    name: Build Signed Android AAB
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/generate.sh

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed AAB
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          test -n "$PROD_SUPABASE_URL"
          test -n "$PROD_SUPABASE_ANON_KEY"
          flutter build appbundle --release             --dart-define=SUPABASE_URL="$PROD_SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$PROD_SUPABASE_ANON_KEY"             --dart-define=BUILD_FINGERPRINT=RELEASE             --dart-define=COMMIT_HASH="${{ github.sha }}"             --dart-define=APP_VERSION="${{ github.ref_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: build/app/outputs/bundle/release/app-release.aab

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [web, android]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}"             release-artifacts/*             --repo "${{ github.repository }}"             --generate-notes             --verify-tag
