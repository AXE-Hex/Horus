name: Horus CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Restore dependencies
        run: flutter pub get --enforce-lockfile

      - name: Regenerate tracked Dart output
        run: |
          dart run build_runner build
          dart run slang

      - name: Verify generated output is current
        run: |
          git diff --exit-code -- lib
          test -z "$(git ls-files --others --exclude-standard -- lib)"

      - name: Check patch whitespace
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$DIFF_BASE" "$DIFF_HEAD"
          elif [[ "$DIFF_BASE" =~ ^0+$ ]]; then
            git diff --check "$DIFF_HEAD^" "$DIFF_HEAD"
          else
            git diff --check "$DIFF_BASE" "$DIFF_HEAD"
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Custom lint
        run: dart run custom_lint

      - name: Flutter tests
        run: flutter test

      - name: Generate coverage
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  database-validation:
    name: Database Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset from migrations
        run: supabase db reset --local

      - name: Run pgTAP authorization and contract tests
        run: supabase test db --local

      - name: Lint local schema
        run: supabase db lint --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install JDK for Android Gradle
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get --enforce-lockfile

      - name: Regenerate tracked Dart output
        run: |
          dart run build_runner build
          dart run slang

      - name: Verify generated output is current
        run: |
          git diff --exit-code -- lib
          test -z "$(git ls-files --others --exclude-standard -- lib)"

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Flutter Web release
        run: flutter build web --release
