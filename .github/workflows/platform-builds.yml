name: Horus Platform Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "windows/**"
      - "web/**"
      - ".github/workflows/platform-builds.yml"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.38.7"

jobs:
  linux:
    name: Linux Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: bash tool/generate.sh
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v7
        with:
          name: horus-linux-${{ github.sha }}
          path: build/linux/**/release/bundle/
          retention-days: 7

  windows:
    name: Windows Build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate code
        shell: pwsh
        run: |
          flutter pub get
          dart run slang
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: horus-windows-${{ github.sha }}
          path: build/windows/**/runner/Release/
          retention-days: 7

  macos:
    name: macOS Build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/generate.sh
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v7
        with:
          name: horus-macos-${{ github.sha }}
          path: build/macos/Build/Products/Release/
          retention-days: 7

  ios:
    name: iOS Unsigned Build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/generate.sh
      - run: flutter build ios --release --no-codesign
