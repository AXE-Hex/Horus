include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/diagnostic_schema.dart"
    - "docs/**"
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    - web/**
  errors:
    invalid_use_of_internal_member: ignore

linter:
  rules:
    avoid_print: false
